<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Kalkulator Sistem Bilangan
                        </h2>

                        <!-- Input Angka -->
                        <div class="mb-3">
                            <label for="angka" class="form-label">
                                Masukkan Angka
                            </label>
                            <input
                                type="text"
                                id="angka"
                                class="form-control"
                                placeholder="Contoh: 1010"
                            >
                        </div>

                        <!-- Jenis Bilangan Input -->
                        <div class="mb-3">
                            <label for="jenisInput" class="form-label">
                                Jenis Bilangan Input
                            </label>

                            <select id="jenisInput" class="form-select">
                                <option value="2">Biner</option>
                                <option value="8">Oktal</option>
                                <option value="10" selected>Desimal</option>
                                <option value="16">Hexadesimal</option>
                            </select>
                        </div>

                        <!-- Jenis Bilangan Hasil -->
                        <div class="mb-3">
                            <label for="jenisHasil" class="form-label">
                                Jenis Bilangan Hasil
                            </label>

                            <select id="jenisHasil" class="form-select">
                                <option value="2">Biner</option>
                                <option value="8">Oktal</option>
                                <option value="10">Desimal</option>
                                <option value="16" selected>Hexadesimal</option>
                            </select>
                        </div>

                        <!-- Tombol -->
                        <button
                            onclick="konversi()"
                            class="btn btn-primary w-100 mb-4"
                        >
                            Konversi
                        </button>

                        <!-- Hasil -->
                        <div class="text-center">
                            <label class="form-label">
                                Hasil Konversi
                            </label>

                            <div
                                id="hasil"
                                class="display-4 fw-bold text-primary"
                            >
                                -
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function konversi() {

            const angka = document.getElementById("angka").value.trim();
            const jenisInput = parseInt(
                document.getElementById("jenisInput").value
            );
            const jenisHasil = parseInt(
                document.getElementById("jenisHasil").value
            );

            const hasil = document.getElementById("hasil");

            // Jika input kosong
            if (angka === "") {
                hasil.innerHTML = "Masukkan angka!";
                hasil.className = "display-6 fw-bold text-danger";
                return;
            }

            // Ubah input menjadi angka desimal
            const nilaiDesimal = parseInt(angka, jenisInput);

            // Cek input valid atau tidak
            if (isNaN(nilaiDesimal)) {
                hasil.innerHTML = "Input tidak valid!";
                hasil.className = "display-6 fw-bold text-danger";
                return;
            }

            // Konversi ke sistem bilangan tujuan
            const hasilKonversi = nilaiDesimal.toString(jenisHasil);

            // Tampilkan hasil
            hasil.innerHTML = hasilKonversi.toUpperCase();
            hasil.className = "display-4 fw-bold text-primary";
        }
    </script>

</body>
</html>
